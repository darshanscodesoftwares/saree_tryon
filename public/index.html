<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saree Try-On — Prototype</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<main id="viewer">
  <div id="stage">
    <video id="video" playsinline muted autoplay class="mirrored"></video>
    <canvas id="canvas"></canvas>
    <p id="status" role="status">Starting…</p>
  </div>
</main>

<aside id="panel">
  <header>
    <h1>Saree Try-On</h1>
    <p class="sub">Prototype &middot; <span id="fps">0</span> fps</p>
  </header>

  <section>
    <h2>Saree</h2>
    <label for="model">Model</label>
    <select id="model"></select>
    <p class="hint"><span id="model-count">loading…</span></p>
    <p class="hint" id="model-tags">&nbsp;</p>
  </section>

  <section>
    <h2>Fit</h2>
    <p class="hint">Calibration only. A saree's own fit is stored against it once this reaches the admin panel.</p>

    <label for="scale">Overall size <span id="scale-value" class="num">1.00</span></label>
    <input type="range" id="scale" min="0.6" max="1.8" step="0.01" value="1">

    <label for="offsetY">Up / down <span id="offsetY-value" class="num">0.00</span></label>
    <input type="range" id="offsetY" min="-0.6" max="0.6" step="0.01" value="0">

    <label for="opacity">Opacity <span id="opacity-value" class="num">1.00</span></label>
    <input type="range" id="opacity" min="0.3" max="1" step="0.01" value="1">
  </section>

  <section>
    <h2>View</h2>
    <label class="check"><input type="checkbox" id="mirror" checked> Mirror view</label>
  </section>

  <section class="actions">
    <button type="button" id="snapshot">Save snapshot</button>
    <button type="button" id="reset" class="ghost">Reset fit</button>
  </section>

  <footer>
    <p class="hint">Tracking runs on-device. No video frame leaves this browser.</p>
  </footer>
</aside>

<script type="module" src="js/main.js"></script>
</body>
</html>
