<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fit test</title>
<!--
  The fit on a synthetic body, for checking a change to the warp without a
  person in front of a camera. Each panel hands Stage.update() a made-up set of
  pose landmarks and a person mask drawn from the same schematic body that is
  shown behind the garment. ?saree=<id> picks the entry; the default one
  otherwise. ?mask=0 leaves the outline out, to see the fit without it.
-->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
<style>
  body { margin: 0; background: #222; color: #ddd; font: 13px system-ui, sans-serif; }
  #grid { display: grid; grid-template-columns: repeat(3, 300px); gap: 12px; padding: 12px; }
  figure { margin: 0; }
  .panel { position: relative; width: 300px; height: 400px; background: #6f7a80; overflow: hidden; }
  .panel canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  figcaption { padding: 6px 2px; }
</style>
</head>
<body>
<div id="grid"></div>
<script type="module">
import { Stage } from "./js/scene.js";
import { POSE } from "./js/tracking.js";
import { byId, defaultSaree } from "./js/library.js";

const W = 300, H = 400;
const params = new URLSearchParams(location.search);
const saree = byId(params.get("saree")) ?? defaultSaree();
const useMask = params.get("mask") !== "0";

// A body in camera pixels, as the unmirrored camera sees it: the subject's own
// left is on the image's right. `yaw` turns her away (the shoulders
// foreshorten), `tilt` drops her left shoulder, `lean` moves her hips sideways
// against her shoulders, `girth` widens the outline round the same joints,
// and `raise` lifts the right arm with its hand across the chest - dragging
// the right shoulder point up by `drag`, as the pose model does. `arms` is
// how they hang otherwise: "away" a little from the sides, as a model is
// asked to stand, "sides" straight down against them, "hips" hands on hips,
// "out" held straight out to the sides at shoulder height, "down45" down and
// out at 45°, "rightUp" the right arm raised 60° from the side and the left
// hanging. `man` draws a straight torso in place of the model's waist.
// `raiseBoth` lifts both arms high, dragging both shoulder points up and out
// by `drag`. `arms` as a number swings both that many degrees out from
// hanging straight down; past 60 it drags the shoulders as `raiseBoth` does.
// `sleeves` thickens the upper arms, as a man's short-sleeved shirt does,
// and `noMouth` puts the head out of the top of the frame.
function body({ cx, sy, width, yaw = 0, tilt = 0, lean = 0, girth = 1, man = false, raise = false, raiseBoth = false, drag = 0, arms = "away", sleeves = 1, noMouth = false, hipsInFrame }) {
  const w = width * Math.cos(yaw * Math.PI / 180);
  const dy = Math.tan(tilt * Math.PI / 180) * w / 2;
  // The proportions scene.js assumes for hips it cannot see, so a body with
  // its hips in frame and one without are the same body.
  const torso = width * 1.56, neck = width * 0.5;
  const hw = w * 0.51;
  const sl = [cx + w / 2, sy + dy], sr = [cx - w / 2, sy - dy];
  const hl = [cx + lean + hw / 2, sy + torso], hr = [cx + lean - hw / 2, sy + torso];
  // An arm at `deg` from hanging straight down, outward.
  const swung = (s, side, deg) => {
    const a = (deg * Math.PI) / 180, dx = side * Math.sin(a), dy = Math.cos(a);
    const e = [s[0] + dx * 0.9 * width, s[1] + dy * 0.9 * width];
    const wr = [e[0] + dx * 0.75 * width, e[1] + dy * 0.75 * width];
    return [e, wr, [wr[0] + dx * 0.22 * width, wr[1] + dy * 0.22 * width]];
  };
  const hang = (s, side) => {
    if (typeof arms === "number") return swung(s, side, arms);
    if (arms === "down45") return swung(s, side, 45);
    if (arms === "rightUp") return side < 0 ? swung(s, side, 120) : swung(s, side, 8);
    if (arms === "out") {
      const e = [s[0] + side * 0.75 * width, s[1] - 0.02 * width];
      const wr = [e[0] + side * 0.7 * width, e[1] - 0.05 * width];
      return [e, wr, [wr[0] + side * 0.2 * width, wr[1]]];
    }
    if (arms === "hips") {
      const e = [s[0] + side * 0.55 * width, s[1] + 0.75 * width];
      const wr = [cx + side * 0.62 * w, sy + 1.3 * width];
      return [e, wr, [cx + side * 0.5 * w, sy + 1.4 * width]];
    }
    const out = arms === "sides" ? [0.08, 0] : [0.12, 0.05];
    const e = [s[0] + side * out[0] * width, s[1] + 0.9 * width];
    const wr = [e[0] + side * out[1] * width, e[1] + 0.75 * width];
    return [e, wr, [wr[0], wr[1] + 0.22 * width]];
  };
  let [el, wl, handL] = hang(sl, 1);
  let [er, wrr, handR] = hang(sr, -1);
  if (raiseBoth) {
    for (const [side, s] of [[1, sl], [-1, sr]]) {
      const e = [s[0] + side * 0.55 * width, s[1] - 0.55 * width];
      const wr = [e[0] + side * 0.3 * width, e[1] - 0.65 * width];
      const hand = [wr[0] + side * 0.05 * width, wr[1] - 0.2 * width];
      if (side === 1) [el, wl, handL] = [e, wr, hand];
      else [er, wrr, handR] = [e, wr, hand];
    }
  }
  if (raise) {
    er = [cx - 0.95 * w, sy + 0.15 * width];
    wrr = [cx - 0.05 * w, sy + 0.15 * width];
    handR = [cx + 0.15 * w, sy + 0.02 * width];
  }
  const both = raiseBoth || (typeof arms === "number" && arms > 60);
  const px = {
    [POSE.SHOULDER_LEFT]: both ? [sl[0] + drag * width * 0.5, sl[1] - drag * width] : sl,
    [POSE.SHOULDER_RIGHT]: [sr[0] - (both ? drag * width * 0.5 : 0), sr[1] - drag * width],
    [POSE.HIP_LEFT]: hl, [POSE.HIP_RIGHT]: hr,
    [POSE.ELBOW_LEFT]: el, [POSE.ELBOW_RIGHT]: er,
    [POSE.WRIST_LEFT]: wl, [POSE.WRIST_RIGHT]: wrr,
    [POSE.INDEX_LEFT]: [handL[0] - 5, handL[1]], [POSE.PINKY_LEFT]: [handL[0] + 5, handL[1]],
    [POSE.INDEX_RIGHT]: [handR[0] + 5, handR[1]], [POSE.PINKY_RIGHT]: [handR[0] - 5, handR[1]],
    [POSE.MOUTH_LEFT]: [cx + w * 0.06 + yaw * 0.6, sy - neck],
    [POSE.MOUTH_RIGHT]: [cx - w * 0.06 + yaw * 0.6, sy - neck],
    [POSE.NOSE]: [cx + yaw * 0.7, sy - neck - width * 0.12],
  };
  const marks = Array.from({ length: 33 }, () => ({ x: 0, y: 0, z: 0, visibility: 0 }));
  for (const [k, [x, y]] of Object.entries(px)) marks[k] = { x: x / W, y: y / H, z: 0, visibility: 0.99 };
  const hipsSeen = hipsInFrame && marks[POSE.HIP_LEFT].y <= 1;
  if (!hipsSeen) marks[POSE.HIP_LEFT].visibility = marks[POSE.HIP_RIGHT].visibility = 0.1;
  if (noMouth) for (const k of [POSE.MOUTH_LEFT, POSE.MOUTH_RIGHT, POSE.NOSE]) marks[k].visibility = 0.1;
  // The outline is drawn from the true shoulders, not the dragged point.
  return { marks, hipsSeen, shape: { sl, sr, hl, hr, el, er, wl, wr: wrr, handL, handR, w, width, girth, man, sleeves, nose: px[POSE.NOSE] } };
}

// Head, neck, torso and arms. `m` maps a camera point to where it is drawn:
// mirrored for the picture, as the app shows the camera, and as-is for the
// mask, which is in the camera's own frame.
function drawBody(ctx, shape, m, fill, stroke) {
  const { sl, sr, hl, hr, el, er, wl, wr, handL, handR, w, width, girth, man, sleeves, nose } = shape;
  const P = (p) => m(p);
  ctx.fillStyle = fill;
  ctx.strokeStyle = stroke;
  ctx.lineWidth = stroke ? 2 : 0;
  const poly = (pts) => { ctx.beginPath(); pts.map(P).forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill(); if (stroke) ctx.stroke(); };
  const mid = [(sl[0] + sr[0]) / 2, (sl[1] + sr[1]) / 2];
  poly([[mid[0] - w * 0.12, mid[1]], [mid[0] - w * 0.1, nose[1] + width * 0.1], [mid[0] + w * 0.1, nose[1] + width * 0.1], [mid[0] + w * 0.12, mid[1]]]);
  const [nx, ny] = P([nose[0], nose[1] - width * 0.05]);
  ctx.beginPath(); ctx.ellipse(nx, ny, width * 0.22, width * 0.29, 0, 0, Math.PI * 2); ctx.fill(); if (stroke) ctx.stroke();
  // The torso: out past the joints at the shoulders, in at the waist, out at
  // the hips, each side measured from the body's middle at that height. The
  // widths are the mustard saree's model's own outline against the pose
  // model's joints on her: 1.3 at the shoulders, 1.09 across the chest,
  // 1.03 at the waist, 1.29 at the hips.
  const at = (t, k) => {
    const l = [sl[0] + (hl[0] - sl[0]) * t, sl[1] + (hl[1] - sl[1]) * t];
    const r = [sr[0] + (hr[0] - sr[0]) * t, sr[1] + (hr[1] - sr[1]) * t];
    const c = [(l[0] + r[0]) / 2, (l[1] + r[1]) / 2];
    const half = (w / 2) * k * girth;
    return [[c[0] + half, c[1]], [c[0] - half, c[1]]];
  };
  // A man's torso is straighter: no waist, and hips no wider than it. A
  // guess at the proportions, against the same joints. The shoulders' tops
  // are a little above the joints, as a real body's are: level with them,
  // the shoulder line ran along the outline's very edge.
  const profile = man
    ? [[-0.08, 1.2], [0, 1.3], [0.3, 1.24], [0.6, 1.18], [1.0, 1.15], [1.4, 1.15]]
    : [[-0.08, 1.2], [0, 1.3], [0.3, 1.09], [0.6, 1.03], [1.0, 1.29], [1.4, 1.3]];
  const rows = profile.map(([t, k]) => at(t, k));
  poly([...rows.map((r) => r[0]), ...rows.map((r) => r[1]).reverse()]);
  // The arms, as thick strokes: upper arm, forearm, hand.
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  for (const [s, e, wr_, hand] of [[sl, el, wl, handL], [sr, er, wr, handR]]) {
    for (const [a, b, thick] of [[s, e, 0.26 * sleeves], [e, wr_, 0.2], [wr_, hand, 0.22]]) {
      const [ax, ay] = P(a), [bx, by] = P(b);
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = width * thick + 4; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); }
      ctx.strokeStyle = fill; ctx.lineWidth = width * thick; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    }
  }
}

// The person mask for a body. `ragged` makes it like the pose model's: read
// in blocks, with the edge decided afresh - and differently - every frame.
function maskOf(shape, ragged = false) {
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  drawBody(ctx, shape, (p) => p, "#fff", null);
  const rgba = ctx.getImageData(0, 0, W, H).data;
  const data = new Uint8Array(W * H);
  for (let i = 0; i < data.length; i++) data[i] = rgba[i * 4];
  if (!ragged) return { data, width: W, height: H };
  const B = 6;
  const out = new Uint8Array(W * H);
  for (let by = 0; by < H; by += B) {
    for (let bx = 0; bx < W; bx += B) {
      let sum = 0, n = 0;
      for (let y = by; y < Math.min(by + B, H); y++) for (let x = bx; x < Math.min(bx + B, W); x++) { sum += data[y * W + x]; n++; }
      const v = sum / n / 255 + (Math.random() - 0.5) * 0.9 > 0.5 ? 255 : 0;
      for (let y = by; y < Math.min(by + B, H); y++) for (let x = bx; x < Math.min(bx + B, W); x++) out[y * W + x] = v;
    }
  }
  return { data: out, width: W, height: H };
}

const CASES = [
  ["Square-on, neck to stomach", { cx: 150, sy: 150, width: 150, hipsInFrame: false }],
  ["Turned 35°, leaning, neck to stomach", { cx: 160, sy: 150, width: 150, yaw: 35, tilt: 8, lean: -20, hipsInFrame: false }],
  ["Broader body, same joints", { cx: 150, sy: 150, width: 150, girth: 1.2, hipsInFrame: false }],
  ["Square-on, hips in frame", { cx: 150, sy: 110, width: 110, hipsInFrame: true }],
  ["Turned 35°, leaning, hips in frame", { cx: 155, sy: 110, width: 110, yaw: 35, tilt: 8, lean: -25, hipsInFrame: true }],
  ["Right arm up, hand across the chest", { cx: 150, sy: 150, width: 150, raise: true, drag: 0.15, hipsInFrame: false }],
  ["Arms straight down against the sides", { cx: 150, sy: 120, width: 120, arms: "sides", hipsInFrame: true }],
  ["Hands on hips", { cx: 150, sy: 120, width: 120, arms: "hips", hipsInFrame: true }],
  ["Arms against the sides, broader body", { cx: 150, sy: 120, width: 120, arms: "sides", girth: 1.2, hipsInFrame: true }],
  ["Ragged outline, as the pose model's", { cx: 150, sy: 150, width: 150, arms: "sides", ragged: true, hipsInFrame: false }],
  ["Ragged outline, sized up 1.4×", { cx: 150, sy: 150, width: 150, arms: "sides", ragged: true, scale: 1.4, hipsInFrame: false }],
  ["Ragged, broader body, arms down", { cx: 150, sy: 150, width: 150, arms: "sides", girth: 1.25, ragged: true, hipsInFrame: false }],
  ["Arms straight out to the sides", { cx: 150, sy: 120, width: 100, arms: "out", hipsInFrame: true }],
  ["Arms out, turned 35°", { cx: 150, sy: 120, width: 100, yaw: 35, tilt: 6, arms: "out", hipsInFrame: true }],
  ["Arms out, ragged outline", { cx: 150, sy: 120, width: 100, arms: "out", ragged: true, hipsInFrame: true }],
  ["Both arms raised high", { cx: 150, sy: 170, width: 120, raiseBoth: true, drag: 0.15, hipsInFrame: false }],
  ["Both raised, turned 35°", { cx: 155, sy: 170, width: 120, yaw: 35, tilt: 6, raiseBoth: true, drag: 0.15, hipsInFrame: false }],
  ["Man, arms close, ragged", { cx: 150, sy: 130, width: 140, man: true, arms: "sides", ragged: true, hipsInFrame: false }],
  ["Man, right arm raised, ragged", { cx: 150, sy: 150, width: 140, man: true, arms: "rightUp", ragged: true, hipsInFrame: false }],
  ["Man, arms down and out, ragged", { cx: 150, sy: 130, width: 130, man: true, arms: "down45", ragged: true, hipsInFrame: false }],
  ["Man, shirt sleeves, arms 15° out", { cx: 150, sy: 120, width: 140, man: true, sleeves: 1.35, arms: 15, ragged: true, hipsInFrame: false }],
  ["Man, shirt sleeves, arms up, no head", { cx: 150, sy: 90, width: 105, man: true, sleeves: 1.35, arms: 110, drag: 0.12, noMouth: true, ragged: true, hipsInFrame: false }],
  ["Man, shirt sleeves, arms out, turned", { cx: 150, sy: 110, width: 100, yaw: 25, man: true, sleeves: 1.35, arms: "out", ragged: true, hipsInFrame: false }],
];

const grid = document.getElementById("grid");
// One stage draws every panel in turn and its picture is copied into the
// panel: a browser allows about sixteen WebGL contexts, and there are more
// cases than that. The stage's canvas has to be laid out for its size to be
// read, so it is kept on the page, off to the side.
const shared = document.createElement("canvas");
shared.style.cssText = `position:absolute; left:-${W * 2}px; top:0; width:${W}px; height:${H}px`;
document.body.appendChild(shared);
const stage = new Stage(shared);
stage.resize(W, H);
stage.setVideoSize(W, H);
stage.wear(saree);

const panels = [];
for (const [label, spec] of CASES) {
  const fig = document.createElement("figure");
  fig.innerHTML = `<div class="panel"><canvas class="bg" width="${W}" height="${H}"></canvas><canvas class="gl" width="${W}" height="${H}"></canvas></div><figcaption>${label}</figcaption>`;
  grid.appendChild(fig);
  const b = body(spec);
  drawBody(fig.querySelector(".bg").getContext("2d"), b.shape, ([x, y]) => [W - x, y], "#c79a7a", "#5a3a2a");
  // A raised arm is held against how the shoulders sat with the arms down,
  // so that pose is seen first, as it would be on a camera.
  const raised = spec.raise || spec.raiseBoth || (typeof spec.arms === "number" && spec.arms > 60) || spec.arms === "out";
  const before = raised ? body({ ...spec, raise: false, raiseBoth: false, arms: typeof spec.arms === "number" || spec.arms === "out" ? 8 : spec.arms, drag: 0 }) : null;
  panels.push({ out: fig.querySelector(".gl").getContext("2d"), b, before, spec, mask: useMask ? maskOf(b.shape) : null });
}

// The texture arrives asynchronously, and its edges are measured once it
// has. The fit is damped, and the build read slowly, so each case is run for
// enough frames to settle.
const ready = () => stage.material.map?.image && stage.garment.photoEdges;
const wait = () => ready() ? draw() : setTimeout(wait, 50);
function draw() {
  for (const { out, b, before, spec, mask } of panels) {
    stage.hide();
    stage.settings.scale = spec.scale ?? 1;
    if (before) stage.update(before.marks, before.hipsSeen, mask && maskOf(before.shape));
    for (let i = 0; i < 60; i++) stage.update(b.marks, b.hipsSeen, mask && (spec.ragged ? maskOf(b.shape, true) : mask));
    stage.render();
    out.clearRect(0, 0, W, H);
    out.drawImage(shared, 0, 0, W, H);
  }
  document.title = "Fit test - ready";
}
wait();
</script>
</body>
</html>
