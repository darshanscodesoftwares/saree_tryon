<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pose test</title>
<!--
  The whole pipeline - the real pose model, its mask, the fit - on a still
  photo instead of the camera, for checking without a person in front of one.
  ?img=<url> is the photo, served from this origin; ?saree=<id> the entry.

  The telling photo is the saree's own source photo: the cut-out should land
  back on the model's own saree, and anywhere it does not is the anchors and
  the pose model disagreeing about where her joints are.
-->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
<style>
  body { margin: 0; background: #222; color: #ddd; font: 13px system-ui, sans-serif; }
  #row { display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
  .panel { position: relative; }
  .panel canvas, .panel img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mirrored { transform: scaleX(-1); }
  pre { margin: 12px; }
</style>
</head>
<body>
<div id="row"></div>
<pre id="log"></pre>
<script type="module">
import { Stage } from "./js/scene.js";
import { Tracker, POSE } from "./js/tracking.js";
import { byId, defaultSaree } from "./js/library.js";

const params = new URLSearchParams(location.search);
const saree = byId(params.get("saree")) ?? defaultSaree();
const log = (s) => (document.getElementById("log").textContent += s + "\n");

const img = new Image();
img.src = params.get("img");
await img.decode();
const H = 640, W = Math.round((H * img.naturalWidth) / img.naturalHeight);

const tracker = new Tracker();
await tracker.ensure();
const body = tracker.detect(img, 1);
if (!body) throw new Error("no body found in the photo");
const m = body.marks;
const px = (k) => `${(m[k].x * img.naturalWidth).toFixed(0)},${(m[k].y * img.naturalHeight).toFixed(0)}`;
log(`pose model, in photo pixels: shoulders L ${px(POSE.SHOULDER_LEFT)}  R ${px(POSE.SHOULDER_RIGHT)}   hips L ${px(POSE.HIP_LEFT)}  R ${px(POSE.HIP_RIGHT)}   mouth L ${px(POSE.MOUTH_LEFT)}  R ${px(POSE.MOUTH_RIGHT)}   hips seen: ${body.hipsSeen}`);
log(`--anchors ${px(POSE.SHOULDER_LEFT)} ${px(POSE.SHOULDER_RIGHT)} ${px(POSE.HIP_LEFT)} ${px(POSE.HIP_RIGHT)}`);
log(`mask: ${body.mask ? body.mask.width + "x" + body.mask.height : "none"}`);

// Three panels: the photo, the photo with the garment, and the garment with
// no outline to clip to.
for (const [label, mask] of [["photo", undefined], ["fitted", body.mask], ["no outline", null]]) {
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.style.width = W + "px";
  panel.style.height = H + "px";
  panel.innerHTML = `<img class="mirrored" src="${img.src}"><canvas></canvas>`;
  document.getElementById("row").appendChild(panel);
  if (mask === undefined) continue;
  const stage = new Stage(panel.querySelector("canvas"));
  stage.resize(W, H);
  stage.setVideoSize(img.naturalWidth, img.naturalHeight);
  stage.wear(saree);
  await new Promise((done) => {
    const wait = () => (stage.garment.photoEdges ? done() : setTimeout(wait, 50));
    wait();
  });
  for (let i = 0; i < 60; i++) stage.update(m, body.hipsSeen, mask);
  if (mask) log(`build read: ${stage._build.map((b) => b.toFixed(3)).join(" ")}`);
  stage.render();
}
document.title = "Pose test - ready";
</script>
</body>
</html>
